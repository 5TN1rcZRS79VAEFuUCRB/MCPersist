name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew :fabric:build :fabric:modernRemapJar
      - uses: actions/upload-artifact@v4
        with:
          name: mcpersist-fabric-modern
          path: |
            fabric/build/libs/*-modern.jar
            !fabric/build/libs/*-dev-shadow-modern.jar

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mcpersist-fabric-modern
          path: jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - shell: bash
        run: python -u test/smoke.py jar/*-modern.jar

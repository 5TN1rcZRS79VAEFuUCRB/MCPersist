name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: mcpersist-forge
          path: forge/build/libs/mcpersist-forge-*.jar

  smoke:
    name: smoke (${{ matrix.loader }}, ${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        loader: [forge]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mcpersist-${{ matrix.loader }}
          path: jar
      # 1.20.1 players run the game on Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The stable-address scenario runs against a local relay, on Linux only.
      - if: runner.os == 'Linux'
        run: |
          cargo install --locked --git https://github.com/5TN1rcZRS79VAEFuUCRB/mcpersist-relay
          echo "MCPERSIST_RELAY=$HOME/.cargo/bin/mcpersist-relay" >> "$GITHUB_ENV"
      - shell: bash
        run: python -u test/smoke.py jar/mcpersist-${{ matrix.loader }}-*.jar

name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          # A tag like v2.0.0-alpha.11-mc1.20.1: the jar carries the whole name, Modrinth the base.
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BASE=${version%-mc*}" >> "$GITHUB_ENV"
          echo "MINECRAFT=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          sh ./gradlew build -Pmod_version="$version"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never "Latest": that stays the main line's release for the newest Minecraft.
          gh release create "$GITHUB_REF_NAME" forge/build/libs/mcpersist-forge-"$VERSION".jar \
            --title "MCPersist $BASE for Minecraft $MINECRAFT (Forge)" --generate-notes --latest=false
      # Needs the MODRINTH_TOKEN secret and MODRINTH_PROJECT_ID variable; skipped until they exist.
      - name: Modrinth
        if: env.MODRINTH_TOKEN != '' && vars.MODRINTH_PROJECT_ID != ''
        env:
          PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          case "$BASE" in *alpha*) type=alpha ;; *beta*|*rc*) type=beta ;; *) type=release ;; esac
          jq -n --arg project "$PROJECT" --arg base "$BASE" --arg type "$type" --arg mc "$MINECRAFT" \
              --arg tag "$GITHUB_REF_NAME" '{
            project_id: $project, name: "MCPersist \($base) (forge, \($mc))", version_number: "\($base)+forge-\($mc)",
            version_type: $type, changelog: "https://github.com/5TN1rcZRS79VAEFuUCRB/MCPersist/releases/tag/\($tag)",
            game_versions: [$mc], loaders: ["forge"], featured: true, file_parts: ["file"],
            # Only the host needs it; players who join may add it for peer-to-peer.
            environment: "client_only",
            dependencies: []
          }' > data.json
          curl --fail-with-body -sS https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: MCPersist release workflow" \
            -F "data=<data.json;type=application/json" -F "file=@forge/build/libs/mcpersist-forge-$VERSION.jar"

name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in *alpha*) type=alpha ;; *beta*|*rc*) type=beta ;; *) type=release ;; esac
          echo "TYPE=$type" >> "$GITHUB_ENV"
          echo "MINECRAFT=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          sh ./gradlew build -Pmod_version="$version"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not marked pre-release, so the newest v2 build is "Latest" rather than v1's last release.
          # Modrinth still labels it alpha or beta from the version.
          gh release create "$GITHUB_REF_NAME" */build/libs/mcpersist-{fabric,neoforge,forge}-"$VERSION".jar \
            --title "MCPersist $VERSION" --generate-notes --latest
      # Needs the MODRINTH_TOKEN secret and MODRINTH_PROJECT_ID variable; skipped until they exist.
      - name: Modrinth
        if: env.MODRINTH_TOKEN != '' && vars.MODRINTH_PROJECT_ID != ''
        env:
          PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          # One Modrinth version per loader, each with its own jar. Only Fabric's needs another mod.
          for loader in fabric neoforge forge; do
            deps='[]'
            [ "$loader" = fabric ] && deps='[{"project_id": "P7dR8mSH", "dependency_type": "required"}]'
            jq -n --arg project "$PROJECT" --arg version "$VERSION" --arg type "$TYPE" --arg mc "$MINECRAFT" \
                --arg loader "$loader" --argjson deps "$deps" '{
              project_id: $project, name: "MCPersist \($version) (\($loader))", version_number: "\($version)+\($loader)",
              version_type: $type, changelog: "https://github.com/5TN1rcZRS79VAEFuUCRB/MCPersist/releases/tag/v\($version)",
              game_versions: [$mc], loaders: [$loader], featured: true, file_parts: ["file"],
              # Works on a host's game or a dedicated server alone; players who also have it
              # connect peer-to-peer.
              environment: "client_or_server_prefers_both",
              dependencies: $deps
            }' > data.json
            curl --fail-with-body -sS https://api.modrinth.com/v2/version \
              -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: MCPersist release workflow" \
              -F "data=<data.json;type=application/json" -F "file=@$loader/build/libs/mcpersist-$loader-$VERSION.jar"
          done
      # Needs the CURSEFORGE_TOKEN secret and CURSEFORGE_PROJECT_ID variable; skipped until they exist.
      - name: CurseForge
        if: env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != ''
        env:
          PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          api=https://minecraft.curseforge.com/api
          # CurseForge tags files with its own IDs for the Minecraft version, the loader and the side
          # (required): Client, as only the host installs it; its background server copies it along.
          curl --fail-with-body -sS "$api/game/versions" -H "X-Api-Token: $CURSEFORGE_TOKEN" > versions.json
          version_id() {
            id=$(jq --arg name "$1" '[.[] | select(.name == $name)][0].id' versions.json)
            [ "$id" != null ] || { echo "CurseForge has no game version named $1" >&2; exit 1; }
            echo "$id"
          }
          mc=$(version_id "$MINECRAFT")
          client=$(version_id Client)
          for loader in fabric neoforge forge; do
            case "$loader" in fabric) name=Fabric ;; neoforge) name=NeoForge ;; forge) name=Forge ;; esac
            # Only Fabric's needs another mod; CurseForge refuses an empty list of relations.
            jq -n --arg version "$VERSION" --arg type "$TYPE" --arg loader "$loader" \
                --argjson mc "$mc" --argjson client "$client" --argjson loaderId "$(version_id "$name")" '{
              displayName: "MCPersist \($version) (\($loader))", releaseType: $type,
              changelog: "https://github.com/5TN1rcZRS79VAEFuUCRB/MCPersist/releases/tag/v\($version)",
              changelogType: "markdown", gameVersions: [$mc, $loaderId, $client]
            } + if $loader == "fabric"
                then {relations: {projects: [{slug: "fabric-api", type: "requiredDependency"}]}} else {} end' > metadata.json
            curl --fail-with-body -sS "$api/projects/$PROJECT/upload-file" -H "X-Api-Token: $CURSEFORGE_TOKEN" \
              -F "metadata=<metadata.json;type=application/json" -F "file=@$loader/build/libs/mcpersist-$loader-$VERSION.jar"
          done

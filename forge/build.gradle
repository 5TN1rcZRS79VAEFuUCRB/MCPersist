plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}

base {
    archivesName = "${rootProject.archives_base_name}-forge"
}
version = rootProject.mod_version
group = rootProject.maven_group

repositories {
    maven { url 'https://repo.sleeping.town/' }
    maven { url 'https://maven.is-quite.gay/' }
}

// Loader-neutral code lives in common/ (as in e4mc); this project adds the Forge glue.
sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${rootProject.minecraft_version}-${rootProject.forge_version}"
}

// 1.20.1 runs on SRG names: the jar is reobfuscated and the mixins get a refmap.
mixin {
    add sourceSets.main, 'e4mc.refmap.json'
    config 'e4mc.mixins.json'
}

jar {
    manifest.attributes(['MixinConfigs': 'e4mc.mixins.json'])
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Forge 47 ships Mixin but not MixinExtras, which the shared mixins use.
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.4'))
    jarJar(implementation('io.github.llamalad7:mixinextras-forge:0.5.4'))

    // Bundled into the mod jar (jar-in-jar).
    jarJar(implementation("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}")) {
        transitive = false
    }
    jarJar(implementation("link.e4mc:iroh-java:${rootProject.iroh_java_version}")) {
        transitive = false
    }
    jarJar(implementation("dev.dirs:directories:${rootProject.dirs_version}"))
    jarJar(implementation('folk.sisby:kaleido-config:0.3.3+1.3.2'))
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

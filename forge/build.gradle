plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}

base {
    archivesName = "${rootProject.archives_base_name}-forge"
}
version = rootProject.mod_version
group = rootProject.maven_group

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url 'https://repo.sleeping.town/' }
    maven { url 'https://maven.is-quite.gay/' }
    maven { url 'https://maven.maxhenkel.de/repository/public' }
}

// The shared code, as in fabric/build.gradle.
sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
    resources.srcDir rootProject.tasks.named('fetchNatives')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The mod jar is the one with the bundled libraries.
jarJar.register()
tasks.named('jar') {
    archiveClassifier = 'slim'
    manifest {
        attributes['MixinConfigs'] = 'e4mc.mixins.json'
    }
}
tasks.named('jarJar') {
    archiveClassifier = null
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}")

    // Bundled into the mod jar (jar-in-jar).
    implementation jarJar("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}") {
        transitive = false
    }
    implementation jarJar("link.e4mc:iroh-java:${rootProject.iroh_java_version}") {
        transitive = false
    }
    implementation jarJar('folk.sisby:kaleido-config:0.3.3+1.3.2')
    // Simple Voice Chat, when installed, loads link.e4mc.voice.VoicePlugin.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${rootProject.voicechat_api_version}"
    // Forge ships Mixin but not MixinExtras, which the shared mixins use.
    implementation jarJar('io.github.llamalad7:mixinextras-forge:0.5.4')
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

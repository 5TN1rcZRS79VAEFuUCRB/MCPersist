plugins {
    id 'net.neoforged.moddev' version '2.0.147'
}

base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}
version = rootProject.mod_version
group = rootProject.maven_group

repositories {
    maven { url 'https://repo.sleeping.town/' }
    maven { url 'https://maven.is-quite.gay/' }
}

// The shared code, as in fabric/build.gradle.
sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = rootProject.neoforge_version
}

dependencies {
    // Bundled into the mod jar (jar-in-jar).
    jarJar(implementation("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}")) {
        transitive = false
    }
    jarJar(implementation("link.e4mc:iroh-java:${rootProject.iroh_java_version}")) {
        transitive = false
    }
    jarJar(implementation("dev.dirs:directories:${rootProject.dirs_version}"))
    jarJar(implementation('folk.sisby:kaleido-config:0.3.3+1.3.2'))
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

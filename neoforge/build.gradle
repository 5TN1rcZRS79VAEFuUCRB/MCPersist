plugins {
    id 'net.neoforged.moddev' version '2.0.147'
}

base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}
version = rootProject.mod_version
group = rootProject.maven_group

repositories {
    maven { url 'https://maven.is-quite.gay/' }
    maven { url 'https://maven.maxhenkel.de/repository/public' }
}

// The shared code, as in fabric/build.gradle.
sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
    resources.srcDir rootProject.tasks.named('fetchNatives')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = rootProject.neoforge_version
}

dependencies {
    // Bundled into the mod jar (jar-in-jar).
    jarJar(implementation("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}")) {
        transitive = false
    }
    jarJar(implementation("link.e4mc:iroh-java:${rootProject.iroh_java_version}")) {
        transitive = false
    }

    // Simple Voice Chat, when installed, loads link.mcpersist.voice.VoicePlugin.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${rootProject.voicechat_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

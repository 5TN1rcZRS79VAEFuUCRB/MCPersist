import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes

import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.ow2.asm:asm:9.8'
    }
}

// The mod is built by the fabric project; see fabric/build.gradle.

// The QUIC (relay) and iroh-java (peer-to-peer) native libraries go in each jar, so nothing is
// downloaded when the game runs. These are the builds those libraries expect, checked against the
// hashes they carry; when either library is updated, update its files here and its suffix in
// MCPersist.
def natives = [
    'netty_quiche_windows_x86_64_74.dll'     : 'cca45c8f4c08525a4edf032b1c77dad9fa03ab99276f9df02a7a13126b600804',
    'libnetty_quiche_linux_x86_64_74.so'     : '96139aaf56d7193be493fbedec55013a215b7a5fd551cf2a624ff2440406f702',
    'libnetty_quiche_linux_aarch_64_74.so'   : '07a5dbd61979785b6466ffa77c44b0e24523c884fc0a72ea61ea591458ae3ec0',
    'libnetty_quiche_osx_x86_64_74.dylib'    : '721cda544e76686f0ff82a184b84053d153cd5104f512168943545d1d243a53f',
    'libnetty_quiche_osx_aarch_64_74.dylib'  : 'f52c90792b06683a3d0b481de738f34e39765f7887250d7a4e273ba44bacb37c',
    'iroh_java_windows_x86_64_57caf9a.dll'   : '534286d02cdc1596ea6064d4193293228baef694d088dc7ddf931a3bdd9106eb',
    'iroh_java_windows_aarch_64_57caf9a.dll' : '8056741ecfe862fcc33996b5f7854902877b13a8eade1d8d89d321cba2642dcb',
    'libiroh_java_linux_x86_64_57caf9a.so'   : '5aa9ed03742af6d37a0797c44efb19ca7c487fc3e6ccd76956b3a58eed9f6246',
    'libiroh_java_linux_aarch_64_57caf9a.so' : '8c45a9e74ca83fddd2e93701818a5043a90f5e0acdd36cd5d8abeb508895ef20',
    'libiroh_java_osx_x86_64_57caf9a.dylib'  : '652331ade05abf7f8d71689817f53a06816d8f764242f4567fdf80249e6e32f5',
    'libiroh_java_osx_aarch_64_57caf9a.dylib': '53389f821ecf57a7924dc23df4cdb8a56ba8bb0a8dd466d68d1b9c72fd5e4c80',
]

// Each loader project adds this task's output to its resources.
tasks.register('fetchNatives') {
    def dir = layout.buildDirectory.dir('natives')
    inputs.property 'natives', natives
    outputs.dir dir
    doLast {
        natives.each { name, sha256 ->
            File file = dir.get().file("mcpersist-natives/$name").asFile
            if (file.isFile() && file.bytes.digest('SHA-256') == sha256) {
                return
            }
            file.parentFile.mkdirs()
            file.bytes = new URL("https://natives.e4mc.link/$name").bytes
            if (file.bytes.digest('SHA-256') != sha256) {
                file.delete()
                throw new GradleException("$name from natives.e4mc.link doesn't match its pinned SHA-256")
            }
        }
    }
}

// The QUIC and iroh-java libraries download their native library when its path property isn't
// set. MCPersist always sets it, but mod hosts reject a jar that holds download code at all, so
// each loader project bundles copies whose loader method only loads the library at that path.
// The copies keep their coordinates and are served from a repository in the build folder.
def patchedLibraries = [
    [module: 'io.netty.incubator:netty-incubator-codec-classes-quic', version: quic_version,
     className: 'io/netty/incubator/codec/quic/Quiche', property: 'link.e4mc.native_path'],
    [module: 'link.e4mc:iroh-java', version: iroh_java_version,
     className: 'link/e4mc/iroh/Native', property: 'link.e4mc.dialtone.native_path'],
]
def patchedRepo = layout.buildDirectory.dir('patched-maven').get().asFile

repositories {
    maven { url 'https://maven.is-quite.gay/' }
}

patchedLibraries.each { library ->
    def (group, name) = library.module.split(':')
    File dir = new File(patchedRepo, "${group.replace('.', '/')}/$name/${library.version}")
    File jar = new File(dir, "$name-${library.version}.jar")
    if (jar.isFile()) {
        return
    }
    File original = configurations.detachedConfiguration(dependencies.create("${library.module}:${library.version}"))
            .tap { transitive = false }.singleFile
    dir.mkdirs()
    new ZipFile(original).withCloseable { zip ->
        new ZipOutputStream(new FileOutputStream(jar)).withCloseable { out ->
            zip.entries().each { ZipEntry entry ->
                // Signatures and digests would no longer match the patched class.
                if (entry.name ==~ /META-INF\/[^\/]+\.(SF|RSA|DSA|EC)/) {
                    return
                }
                byte[] bytes = zip.getInputStream(entry).bytes
                if (entry.name == "${library.className}.class") {
                    bytes = loadOnlyFromPath(bytes, library.property)
                    if (new String(bytes, 'ISO-8859-1').contains('natives.e4mc.link')) {
                        throw new GradleException("${library.module} still holds its native download URL")
                    }
                }
                out.putNextEntry(new ZipEntry(entry.name))
                out.write(bytes)
                out.closeEntry()
            }
        }
    }
    new File(dir, "$name-${library.version}.pom").text = """<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>$group</groupId>
  <artifactId>$name</artifactId>
  <version>${library.version}</version>
</project>
"""
}

/** The class with its loadNativeLibrary() replaced by System.load(System.getProperty(property)). */
static byte[] loadOnlyFromPath(byte[] bytes, String property) {
    // Without the reader, the writer builds a new constant pool, so the old body's strings go.
    ClassWriter writer = new ClassWriter(ClassWriter.COMPUTE_MAXS)
    boolean replaced = false
    new ClassReader(bytes).accept(new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor method = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name != 'loadNativeLibrary' || descriptor != '()V') {
                return method
            }
            replaced = true
            method.visitCode()
            method.visitLdcInsn(property)
            method.visitMethodInsn(Opcodes.INVOKESTATIC, 'java/lang/System', 'getProperty', '(Ljava/lang/String;)Ljava/lang/String;', false)
            method.visitMethodInsn(Opcodes.INVOKESTATIC, 'java/lang/System', 'load', '(Ljava/lang/String;)V', false)
            method.visitInsn(Opcodes.RETURN)
            method.visitMaxs(0, 0)
            method.visitEnd()
            return null
        }
    }, 0)
    if (!replaced) {
        throw new GradleException("no loadNativeLibrary() to replace")
    }
    return writer.toByteArray()
}

subprojects {
    repositories {
        exclusiveContent {
            forRepository {
                maven { url patchedRepo }
            }
            filter {
                patchedLibraries.each { library -> includeModule(*library.module.split(':')) }
            }
        }
    }
}

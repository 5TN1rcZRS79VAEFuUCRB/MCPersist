plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "unstubbedJar")) { transitive false }

    shadowCommon(implementation("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}")) {
        transitive false
    }
    include 'folk.sisby:kaleido-config:0.3.3+1.3.2'
    shadowCommon("link.e4mc:iroh-java:${rootProject.iroh_java_version}") {
        transitive false
    }
    shadowCommon("dev.dirs:directories:${rootProject.dirs_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"

    relocate "dev.dirs", "link.e4mc.shadow.dirs"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").unstubbedSourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

tasks.register('patchFmj', Jar) {
    archiveClassifier = 'dev-shadow-modern'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(file("src/main/resources-modern"), zipTree(shadowJar.archiveFile))
    dependsOn shadowJar
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.register("modernRemapJar", net.fabricmc.loom.task.RemapJarTask) {
    injectAccessWidener = true
    input.set patchFmj.archiveFile
    dependsOn patchFmj
    archiveClassifier = "modern"
    sourceNamespace = "intermediary"
    targetNamespace = "named"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

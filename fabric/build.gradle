plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
}

base {
    archivesName = "${rootProject.archives_base_name}-fabric"
}
version = rootProject.mod_version
group = rootProject.maven_group

repositories {
    maven { url 'https://repo.sleeping.town/' }
    maven { url 'https://maven.is-quite.gay/' }
}

// Loader-neutral code lives in common/ (as in e4mc); this project adds the Fabric glue.
sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Bundled into the mod jar (jar-in-jar).
    include implementation("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}") {
        transitive = false
    }
    include implementation("link.e4mc:iroh-java:${rootProject.iroh_java_version}") {
        transitive = false
    }
    include implementation("dev.dirs:directories:${rootProject.dirs_version}")
    include implementation('folk.sisby:kaleido-config:0.3.3+1.3.2')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
